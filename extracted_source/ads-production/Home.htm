    <style type="text/css">
        html,body{background-color: #fff; margin: 0}

        }

        @media screen and (min-width: 960px) {
            .mobile{display: none;}

            .survey{height: 100%; width:auto; position:relative; left: 0%;}
            .laptop{width: auto; height: auto}
            .loginDefault { bottom: 10%; }
        }

        @media screen and (min-width: 1025px) {
            .survey{height: 100%; width:auto; position:relative; left: 0%;}

        #customFormBtn {
          margin-top: 15px;

        }

             color: #00bcd4;

             font-family: sans-serif;
        }

          display: none;
        }

        .login {
          text-align:center;
          margin: 0 auto;

        .login .input {
          font-size: 1em;
          line-height: 30px;
          margin-bottom: 10px;

          box-sizing: border-box;
        }

        .login select.input {
          height: 40px;
        }

        .login .input:focus {
          border-color: #002395;
        }

        .login--button {
          -webkit-border-radius: 28;
          -moz-border-radius: 28;
          border-radius: 28px;
          font-family: Arial;
          color: #ffffff;
          font-size: 20px;
          background: #009fda;
          padding: 10px 20px 10px 20px;
          text-decoration: none;
          width: 200px;
          margin: auto;

          margin: auto;
          border: none;
        }

        .login--button:hover {

        }

        .login--button[disabled] {

    </style>
</head>
<body>
<script>
  // This is called with the results from from FB.getLoginStatus().
  function statusChangeCallback(response) {
    console.log('statusChangeCallback');
    console.log('getLoginStatus', response);
    // The response object is returned with a status field that lets the
    // app know the current login status of the person.
    // Full docs on the response object can be found in the documentation
    // for FB.getLoginStatus().
    if (response.status === 'connected') {
      // Logged into your app and Facebook.
      testAPI();
    } else {
      // The person is not logged into your app or we are unable to tell.
      console.log('Please log ' + 'into this app.');
    }
  }

  // This function is called when someone finishes with the Login
  // Button.  See the onlogin handler attached to it in the sample
  // code below.
  function checkLoginState() {
    FB.getLoginStatus(function(response) {
      statusChangeCallback(response);
    });
  }
  function checkLikePage(){
    FB.api('/me/likes/987602351409032', function(response) {
      console.log('checkLikePage', response);
    });
    FB.Event.subscribe("edge.create", function(href, widget) {
      console.log(href, widget);
      alert('You just liked the page!');
    });
  }

  window.fbAsyncInit = function() {
    FB.init({
      appId      : '256531144766115',
      cookie     : true,  // enable cookies to allow the server to access the session
      xfbml      : true,  // parse social plugins on this page
      version    : 'v3.0' // use graph api version 2.8
    });
    checkLoginState();
  };

  // Load the SDK asynchronously
  (function(d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));

  // Here we run a very simple test of the Graph API after login is
  // successful.  See statusChangeCallback() for when this call is made.
  function testAPI() {
    console.log('Welcome!  Fetching your information.... ');
    FB.api('/me', function(response) {
      console.log('Successful login for: ' + response.name);
    });
    checkLikePage();
  }
</script>
    <div class="survey">
        <img src="http://210.211.117.184:20081/asset/ngm/banner_survey_desk.png" class="laptop">
        <img src="http://210.211.117.184:20081/asset/ngm/logo.jpg" class="mobile">
        <div class="loginDefault text-right" method="POST" style="text-align: center">
          <h4 class="title">Vui lòng đăng nhập để sử dụng Wifi</h4>
          <form method="POST" name="formLogin" action="/wifi/login" id="formLogin">
            <div class="fb-page" data-href="https://www.facebook.com/engeniusphuongviet/" data-small-header="true" data-adapt-container-width="true" data-hide-cover="false" data-show-facepile="false"><blockquote cite="https://www.facebook.com/engeniusphuongviet/" class="fb-xfbml-parse-ignore"><a href="https://www.facebook.com/engeniusphuongviet/">EnGenius Việt Nam</a></blockquote></div>
            <button id="loginWithLike" type="button" class="login--button" disabled>Truy cập Internet</button>
                     <input type="hidden" id="userurl" name="userurl"></input>
                    <input type="hidden" id="usr" name="username"  value="0">
                    <input type="hidden" id="pswrd" name="password" value="0">
          </form>
          <div id="formData" class="login">
            <input id="name" type="text" name="name" class="input" placeholder="Họ & Tên" required />
            <input id="email" type="email" name="email" class="input" placeholder="Email" required />
            <input id="phone" type="text" name="phone" class="input" placeholder="Phone" required />
            <select id="gender" name="gender" class="input" required >
      				<option value="">Giới tính của bạn?</option>
      				<option value="male">Nam</option>
      				<option value="female">Nữ</option>
      			</select>
            <button type="button" id="submitForm" class="login--button" disabled>Truy cập Internet</button>
          </div>
        </div>
    </div>

    <script type="text/javascript" src="http://cloud.wifiex4u.com:20081/asset/engenius/js/jquery.min.js"></script>
    <script>
        $('#customFormBtn').on('click', function(){
          console.log('click');
          $("#formLogin").hide();
          $("#formData").show();

        });
        $('#customFormBtn').on('click', function(){
          console.log('click');
          $("#formLogin").hide();
          $("#formData").show();

        });
        function faceLogin() {
            M.loginFacebook(encodeURIComponent(M.urlFor('click')));
        }
        $("#face").click(function(){
            faceLogin();
        });

        // VALIDATE
        var checkMail = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        if (/mac os/i.test(navigator.userAgent)) {
          checkMail =  /^(([^<>()\\[\\]\\\\.,;:\\s@"]+(\\.[^<>()\\[\\]\\\\.,;:\\s@"]+)*)|(".+"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;
        }

        var checkPhone = /^0[0-9]{9}[0-9]?$/;

        function formValid() {
          return $("#name").val() && $("#gender").val() && checkMail.test($("#email").val()) && checkPhone.test($("#phone").val());
        }
        function onInput() {
          if (formValid()) {
            $('#submitForm').removeAttr("disabled");
          } else {
            $('#submitForm').attr("disabled", true);
          }
        }
        $("#name").on('input', onInput);
        $("#gender").on('input', onInput);
        $("#email").on('input', onInput);
        $("#phone").on('input', onInput);

        $("#submitForm").on('click', function(){
          document.formLogin.elements.userurl.value = M.urlFor('click', {name: $("#name").val(), email: $("#email").val(), phone: $("#phone").val(), gender: $("#gender").val()});
          document.formLogin.submit();
        });

    </script>
</body>
</html>
