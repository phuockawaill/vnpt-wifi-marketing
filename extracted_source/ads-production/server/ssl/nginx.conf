server {
  listen                *:443 ssl http2;

  server_name           gapis.wifiex4u.vn;

  ssl_certificate /data/wifi4u/ads-https/ads-production/server/ssl/certificate.pem;
  ssl_certificate_key /data/wifi4u/ads-https/ads-production/server/ssl/privatekey.pem;

  access_log            /var/log/nginx/gapis.log;
  error_log             /var/log/nginx/gapis.error.log;

  location / {
    proxy_pass http://0.0.0.0:9080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}

