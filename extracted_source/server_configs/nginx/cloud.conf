server {
    server_name wifidian.vnptbinhduong.vn;

    location / {
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   Host $http_host;
        proxy_pass         "http://127.0.0.1:9080";

	add_header 'Access-Control-Allow-Origin' '*' always;	
    }


	listen 80;
}

server {
    listen 80;
    server_name unifidian.vnptbinhduong.vn;
    location / {
      return 301 https://wifidian.vnptbinhduong.vn/api/common/unifiSplash$request_uri;
    }
}
