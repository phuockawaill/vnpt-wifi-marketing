# Upstream services
upstream backend_api {
    server backend:4000;
}

upstream portal_frontend {
    server portal:3000;
}

upstream dashboard_frontend {
    server dashboard:3001;
}

# ==========================================
# 1. HTTP Server (Port 80)
# Handles Certbot renewal & 302 Redirect to HTTPS
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name portal.daklak.vnpt.vn admin.daklak.vnpt.vn localhost;

    # Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Apple & Android Captive Portal Probe Interceptions
    location = /hotspot-detect.html {
        return 302 https://$host/;
    }
    location = /generate_204 {
        return 302 https://$host/;
    }
    location = /ncsi.txt {
        return 302 https://$host/;
    }

    # Redirect all other HTTP traffic to HTTPS in Production
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. Captive Portal HTTPS Server (Port 443)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.daklak.vnpt.vn localhost;

    # SSL Certificates (Auto-generated by Certbot or custom SSL)
    ssl_certificate /etc/letsencrypt/live/portal.daklak.vnpt.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.daklak.vnpt.vn/privkey.pem;

    # Modern SSL Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Backend API Routing under /api/
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Captive Portal Frontend (Next.js)
    location / {
        proxy_pass http://portal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://portal_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ==========================================
# 3. Admin CMS Dashboard HTTPS Server (Port 443)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.daklak.vnpt.vn;

    ssl_certificate /etc/letsencrypt/live/admin.daklak.vnpt.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.daklak.vnpt.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Dashboard Next.js
    location / {
        proxy_pass http://dashboard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
